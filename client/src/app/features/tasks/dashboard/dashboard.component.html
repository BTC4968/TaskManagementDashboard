<div class="dashboard">
  <header class="page-header">
    <div>
      <h1>Task Dashboard</h1>
      <p class="subtitle">Kanban-style task management with real-time collaboration</p>
    </div>
    <span class="live-indicator" title="WebSocket subscription active">🔴 Live</span>
  </header>

  <div class="dashboard-content">
    <app-kanban-board
      [columns]="columns()"
      [tasks]="tasks()"
      [loading]="facade.loading()"
      [conflicts]="allConflicts()"
      (createColumn)="onCreateColumn()"
      (editTask)="onEditTask($event)"
      (deleteTask)="onDeleteTask($event)"
      (taskMove)="onTaskMove($event)"
      (columnReorder)="onColumnReorder($event)"
    />
  </div>

  <app-task-detail-modal
    [open]="drawerOpen()"
    [mode]="drawerMode()"
    [task]="selectedTask()"
    [conflicts]="allConflicts()"
    (close)="closeModal()"
    (save)="onSaveTask($event)"
    (acceptRemote)="facade.acceptRemoteVersion($event)"
    (dismissConflict)="facade.dismissConflict($event)"
  />
</div>
