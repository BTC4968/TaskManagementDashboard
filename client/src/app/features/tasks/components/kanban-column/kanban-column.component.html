<app-card class="kanban-column">
  <div class="column-header">
    <div class="column-title-area">
      <h3 class="column-title">{{ column().name }}</h3>
      <span class="column-count">{{ getTaskCount() }}</span>
    </div>
    <div class="column-menu-wrapper">
      <button
        type="button"
        class="column-menu-btn"
        aria-label="Column menu"
        (click)="toggleMenu()"
      >
        ⋮
      </button>
      @if (showMenu()) {
        <div class="column-menu">
          <button type="button" class="menu-item" (click)="onEditColumn()">Edit</button>
          <button type="button" class="menu-item menu-item--danger" (click)="onDeleteColumn()">
            Delete
          </button>
        </div>
      }
    </div>
  </div>

  <div
    class="column-tasks"
    [id]="'column-' + column().id"
    cdkDropList
    [cdkDropListData]="tasks()"
    (cdkDropListDropped)="taskDropped.emit($event)"
  >
    @for (task of tasks(); track task.id) {
      <div cdkDrag [cdkDragData]="task">
        <app-task-card
          [task]="task"
          [hasConflict]="hasConflict(task.id)"
          (click)="taskClick.emit(task)"
          (deleteTask)="deleteTask.emit($event)"
        />
        <ng-template cdkDragPlaceholder>
          <div class="task-drag-placeholder"></div>
        </ng-template>
      </div>
    }
  </div>

  @if (tasks().length === 0) {
    <div class="column-empty-state">
      <p>No tasks yet</p>
    </div>
  }
</app-card>
