<div class="input-wrapper">
  @if (label()) {
    <label class="input-label">{{ label() }}</label>
  }
  <input
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [class.input-error]="error()"
    class="input-field"
    #inputEl
    (change)="onValueChange(inputEl.value)"
    (input)="onValueChange(inputEl.value)"
  />
  @if (error()) {
    <p class="input-error-message">{{ error() }}</p>
  }
</div>
